version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Instalando dependências..."
        - npm ci
    build:
      commands:
        - echo "Construindo aplicação..."
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - build/**/*
